[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "neon-sync"
version = "0.1.0"
description = "Universal Media Extraction Engine — modular adapter orchestrator with security-first egress isolation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
webpage = [
    "trafilatura>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "jsonschema>=4.23.0",
    "ruff>=0.7.0",
]

[project.scripts]
neon-sync-api = "neon_sync.api.app:run"
neon-sync-proxy = "neon_sync.security.egress_proxy:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
